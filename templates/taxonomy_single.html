{% extends "base.html" %}

{% block title %}
<title>#{{ term.name }} &middot; {{ config.title }}</title>
{% endblock title %}

{% block content %}
<article class="section">
  <h1>#{{ term.name }}</h1>
  <ul class="post-list">
    {% for page in term.pages %}
    <li>
      <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
      <time datetime="{{ page.date }}">{{ page.date | date(format=config.extra.date_format) }}</time>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock content %}
