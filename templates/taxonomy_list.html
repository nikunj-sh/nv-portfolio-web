{% extends "base.html" %}

{% block title %}
<title>Tags &middot; {{ config.title }}</title>
{% endblock title %}

{% block content %}
<article class="section">
  <h1>Tags</h1>
  <ul class="tag-cloud">
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink | safe }}">#{{ term.name }}</a>
      <span class="tag-count">({{ term.pages | length }})</span>
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock content %}
